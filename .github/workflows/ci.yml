# 类型检查、测试、前端打包。PR 上自动跑；合并到 main 后由 deploy.yml 调用同一份检查，通过了才部署。
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # 和 Dockerfile 一致：Node 24，corepack 装 pnpm 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@12 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
