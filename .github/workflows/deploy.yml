# 合并到 main 后：先跑 ci.yml 的检查，通过后部署到 Fly.io。PR 上不跑这个文件。
# 部署要用仓库 secret FLY_API_TOKEN，由 `fly tokens create deploy -a shengji-zhaopengyou` 生成。
name: Deploy

on:
  push:
    branches: [main]
  # Actions 页面手动重新部署 main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: 部署到 Fly.io
    needs: check
    # 手动触发时也只部署 main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 同一时间只跑一个部署：后来的排队，不打断正在进行的
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # 一台机器加一个卷存快照，不开第二台
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
